# Default hyperparameters per model plus Optuna search spaces.
defaults:
  random_forest:
    n_estimators: 250
    max_depth: 14
    min_samples_leaf: 2
    n_jobs: -1
  xgboost:
    n_estimators: 600
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    tree_method: hist
  lightgbm:
    n_estimators: 700
    learning_rate: 0.05
    num_leaves: 63
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_samples: 20
    verbose: -1
  catboost:
    iterations: 600
    learning_rate: 0.05
    depth: 6
    l2_leaf_reg: 3.0
    verbose: 0
  prophet:
    seasonality_mode: multiplicative
    weekly_seasonality: true
    yearly_seasonality: true
    daily_seasonality: false

search_spaces:
  xgboost:
    learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
    max_depth: {type: int, low: 3, high: 10}
    n_estimators: {type: int, low: 200, high: 1200, step: 100}
    subsample: {type: float, low: 0.6, high: 1.0}
    colsample_bytree: {type: float, low: 0.6, high: 1.0}
    reg_lambda: {type: float, low: 0.1, high: 10.0, log: true}
  lightgbm:
    learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
    num_leaves: {type: int, low: 15, high: 255}
    n_estimators: {type: int, low: 200, high: 1200, step: 100}
    subsample: {type: float, low: 0.6, high: 1.0}
    colsample_bytree: {type: float, low: 0.6, high: 1.0}
    min_child_samples: {type: int, low: 5, high: 60}
  random_forest:
    n_estimators: {type: int, low: 100, high: 800, step: 100}
    max_depth: {type: int, low: 4, high: 24}
    min_samples_leaf: {type: int, low: 1, high: 10}
  catboost:
    learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
    depth: {type: int, low: 4, high: 10}
    iterations: {type: int, low: 200, high: 1200, step: 100}
    l2_leaf_reg: {type: float, low: 1.0, high: 10.0}
